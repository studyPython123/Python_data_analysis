<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学练习应用</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind主题 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        danger: '#EF4444',
                        warning: '#F59E0B',
                        dark: '#1F2937',
                        light: '#F9FAFB'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary transition duration-200;
            }
            .btn-hover {
                @apply hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-light to-blue-50 min-h-screen font-inter text-dark">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 标题区域 -->
        <header class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary mb-2">
                数学练习应用
            </h1>
            <p class="text-gray-600 max-w-xl mx-auto">
                自定义数学题目，锻炼心算能力！。
            </p>
        </header>
        
        <!-- 配置区域 -->
        <div class="bg-white rounded-xl p-6 mb-6 card-shadow">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fa-solid fa-sliders text-primary mr-2"></i>
                练习设置
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 运算类型选择 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        选择运算类型
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center space-x-2 p-3 bg-blue-50 rounded-lg cursor-pointer hover:bg-blue-100 transition">
                            <input type="checkbox" id="add-op" class="form-checkbox h-5 w-5 text-primary rounded border-gray-300 focus:ring-primary" checked>
                            <span>加法</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 bg-green-50 rounded-lg cursor-pointer hover:bg-green-100 transition">
                            <input type="checkbox" id="subtract-op" class="form-checkbox h-5 w-5 text-secondary rounded border-gray-300 focus:ring-secondary" checked>
                            <span>减法</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 bg-orange-50 rounded-lg cursor-pointer hover:bg-orange-100 transition">
                            <input type="checkbox" id="multiply-op" class="form-checkbox h-5 w-5 text-warning rounded border-gray-300 focus:ring-warning" checked>
                            <span>乘法</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 bg-red-50 rounded-lg cursor-pointer hover:bg-red-100 transition">
                            <input type="checkbox" id="divide-op" class="form-checkbox h-5 w-5 text-danger rounded border-gray-300 focus:ring-danger" checked>
                            <span>除法</span>
                        </label>
                    </div>
                </div>
                
                <!-- 位数选择 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        数字位数
                    </label>
                    <div class="flex space-x-3">
                        <label class="flex-1">
                            <input type="radio" name="digits" value="1" class="form-radio h-5 w-5 text-primary" checked>
                            <div class="mt-1 bg-blue-50 p-3 rounded-lg text-center cursor-pointer hover:bg-blue-100 transition">
                                <span class="block font-medium">一位数</span>
                                <span class="text-xs text-gray-500">1-9</span>
                            </div>
                        </label>
                        <label class="flex-1">
                            <input type="radio" name="digits" value="2" class="form-radio h-5 w-5 text-primary">
                            <div class="mt-1 bg-blue-50 p-3 rounded-lg text-center cursor-pointer hover:bg-blue-100 transition">
                                <span class="block font-medium">两位数</span>
                                <span class="text-xs text-gray-500">10-99</span>
                            </div>
                        </label>
                        <label class="flex-1">
                            <input type="radio" name="digits" value="3" class="form-radio h-5 w-5 text-primary">
                            <div class="mt-1 bg-blue-50 p-3 rounded-lg text-center cursor-pointer hover:bg-blue-100 transition">
                                <span class="block font-medium">三位数</span>
                                <span class="text-xs text-gray-500">100-999</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 text-center">
                <button id="generate-btn" onclick="generateProblems()" class="px-6 py-3 bg-primary text-white rounded-lg flex items-center justify-center mx-auto btn-hover">
                    <i class="fa-solid fa-magic mr-2"></i> 生成题目
                </button>
            </div>
        </div>
        
        <!-- 主内容区域 -->
        <main class="bg-white rounded-xl p-6 md:p-8 card-shadow mb-8">
            <div class="flex flex-col md:flex-row gap-6">
                <!-- 题目区域 -->
                <div class="w-full md:w-2/3">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fa-solid fa-calculator text-primary mr-2"></i>
                        题目
                    </h2>
                    
                    <div id="math-problems" class="space-y-6">
                        <!-- 题目将在这里动态生成 -->
                        <div class="text-center py-12 text-gray-500">
                            <i class="fa-solid fa-arrow-down text-4xl mb-3 opacity-30"></i>
                            <p>点击上方"生成题目"按钮开始练习</p>
                        </div>
                    </div>
                </div>
                
                <!-- 历史记录区域 -->
                <div class="w-full md:w-1/3">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-semibold flex items-center">
                            <i class="fa-solid fa-history text-primary mr-2"></i>
                            历史记录
                        </h2>
                        <button id="export-history" onclick="exportHistory()" class="px-3 py-1 text-sm bg-primary text-white rounded-lg btn-hover">
                            <i class="fa-solid fa-download mr-1"></i> 导出
                        </button>
                    </div>
                    
                    <div id="history-container" class="bg-gray-50 rounded-lg p-4 max-h-[400px] overflow-y-auto">
                        <div id="history-list" class="space-y-3">
                            <!-- 历史记录将在这里动态生成 -->
                            <div class="text-center text-gray-500 text-sm">
                                暂无记录
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4 flex justify-between">
                        <button id="clear-history" onclick="clearHistory()" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition duration-200">
                            <i class="fa-solid fa-trash mr-1"></i> 清空历史
                        </button>
                        <span id="stats" class="text-sm text-gray-600 self-end">
                            正确率: 0% (0/0)
                        </span>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 页脚 -->
        <footer class="text-center text-gray-500 text-sm">
            <p>数学练习应用手</p>
        </footer>
    </div>
    
    <script>
        // 存储历史记录
        let history = [];
        // 当前题目
        let currentProblems = {};
        
        // 根据位数生成随机数
        function getRandomNumber(digits) {
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        // 生成除法的随机数（确保能整除）
        function getRandomDivisibleNumbers(digits) {
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            
            let divisor;
            let dividend;
            
            // 确保除数不为0，并且结果是有限小数或整数
            do {
                divisor = Math.floor(Math.random() * (max - min + 1)) + min;
                // 确保被除数是除数的倍数，以便结果为整数
                const multiplier = Math.floor(Math.random() * 10) + 1;
                dividend = divisor * multiplier;
            } while (dividend > max);
            
            return { x: dividend, y: divisor };
        }
        
        // 生成所有题目
        function generateProblems() {
            const problemsContainer = document.getElementById('math-problems');
            problemsContainer.innerHTML = '';
            
            // 获取用户选择的运算类型
            const operations = {
                add: document.getElementById('add-op').checked,
                subtract: document.getElementById('subtract-op').checked,
                multiply: document.getElementById('multiply-op').checked,
                divide: document.getElementById('divide-op').checked
            };
            
            // 验证是否至少选择了一种运算
            const selectedOperations = Object.values(operations).filter(Boolean);
            if (selectedOperations.length === 0) {
                problemsContainer.innerHTML = `
                    <div class="text-center py-12 text-danger">
                        <i class="fa-solid fa-exclamation-triangle text-4xl mb-3"></i>
                        <p>请至少选择一种运算类型</p>
                    </div>
                `;
                return;
            }
            
            // 获取用户选择的数字位数
            const digits = parseInt(document.querySelector('input[name="digits"]:checked').value);
            
            // 重置所有结果显示
            currentProblems = {};
            
            // 为每种选中的运算生成题目
            Object.entries(operations).forEach(([type, isSelected]) => {
                if (!isSelected) return;
                
                let x, y;
                let operator, operationSymbol, colorClass, borderClass;
                
                // 设置运算符号和样式
                switch(type) {
                    case 'add':
                        operator = '+';
                        operationSymbol = '+';
                        colorClass = 'bg-blue-50';
                        borderClass = 'border-primary';
                        break;
                    case 'subtract':
                        operator = '-';
                        operationSymbol = '-';
                        colorClass = 'bg-green-50';
                        borderClass = 'border-secondary';
                        break;
                    case 'multiply':
                        operator = '*';
                        operationSymbol = '×';
                        colorClass = 'bg-orange-50';
                        borderClass = 'border-warning';
                        break;
                    case 'divide':
                        operator = '/';
                        operationSymbol = '÷';
                        colorClass = 'bg-red-50';
                        borderClass = 'border-danger';
                        break;
                }
                
                // 生成随机数
                if (type === 'divide') {
                    const numbers = getRandomDivisibleNumbers(digits);
                    x = numbers.x;
                    y = numbers.y;
                } else {
                    x = getRandomNumber(digits);
                    y = getRandomNumber(digits);
                }
                
                // 创建题目元素
                const problemCard = document.createElement('div');
                problemCard.className = `p-4 ${colorClass} rounded-lg border-l-4 ${borderClass}`;
                problemCard.id = `${type}-problem-card`;
                
                problemCard.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-medium">${type === 'add' ? '加法' : 
                                                  type === 'subtract' ? '减法' : 
                                                  type === 'multiply' ? '乘法' : '除法'}</h3>
                        <span id="${type}-result" class="text-sm"></span>
                    </div>
                    <p id="${type}-problem" class="text-lg mb-2">${x} ${operationSymbol} ${y} = ?</p>
                    <div class="flex items-center">
                        <input type="number" id="${type}-answer" class="w-full px-3 py-2 border border-gray-300 rounded-md input-focus" placeholder="输入答案">
                        <button onclick="checkAnswer('${type}')" class="ml-2 px-4 py-2 ${borderClass.replace('border-', 'bg-')} text-white rounded-md btn-hover">
                            <i class="fa-solid fa-check"></i>
                        </button>
                    </div>
                `;
                
                problemsContainer.appendChild(problemCard);
                
                // 计算并存储正确答案
                let correctAnswer;
                if (type === 'add') correctAnswer = x + y;
                else if (type === 'subtract') correctAnswer = x - y;
                else if (type === 'multiply') correctAnswer = x * y;
                else if (type === 'divide') correctAnswer = (x / y).toFixed(2);
                
                // 存储当前题目和答案
                currentProblems[type] = {
                    problem: `${x} ${operationSymbol} ${y} = ?`,
                    answer: correctAnswer
                };
            });
            
            // 添加动画效果
            const generateBtn = document.getElementById('generate-btn');
            generateBtn.classList.add('animate-spin');
            setTimeout(() => {
                generateBtn.classList.remove('animate-spin');
            }, 500);
        }
        
        // 检查答案
        function checkAnswer(type) {
            if (!currentProblems[type]) return;
            
            const problemEl = document.getElementById(`${type}-problem`);
            const answerEl = document.getElementById(`${type}-answer`);
            const resultEl = document.getElementById(`${type}-result`);
            const userAnswer = parseFloat(answerEl.value);
            const correctAnswer = parseFloat(currentProblems[type].answer);
            
            // 验证输入
            if (isNaN(userAnswer)) {
                resultEl.textContent = '请输入有效的数字';
                resultEl.className = 'text-sm text-warning';
                answerEl.classList.add('border-warning');
                return;
            }
            
            // 判断答案是否正确
            const isCorrect = (type === 'divide') 
                ? userAnswer.toFixed(2) === correctAnswer.toFixed(2) 
                : userAnswer === correctAnswer;
            
            // 显示结果
            if (isCorrect) {
                resultEl.textContent = '正确! ✔️';
                resultEl.className = 'text-sm text-secondary font-medium';
                answerEl.classList.add('border-secondary');
                answerEl.classList.remove('border-danger', 'border-warning');
            } else {
                resultEl.textContent = `错误! 正确答案是 ${correctAnswer}`;
                resultEl.className = 'text-sm text-danger font-medium';
                answerEl.classList.add('border-danger');
                answerEl.classList.remove('border-secondary', 'border-warning');
            }
            
            // 添加到历史记录
            addToHistory({
                type,
                problem: currentProblems[type].problem,
                userAnswer: userAnswer.toFixed(2),
                correctAnswer: correctAnswer.toFixed(2),
                isCorrect
            });
            
            // 添加动画效果
            resultEl.classList.add('animate-pulse');
            setTimeout(() => {
                resultEl.classList.remove('animate-pulse');
            }, 1000);
        }
        
        // 添加到历史记录
        function addToHistory(entry) {
            history.unshift(entry); // 添加到数组开头
            updateHistoryDisplay();
        }
        
        // 更新历史记录显示
        function updateHistoryDisplay() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center text-gray-500 text-sm">
                        暂无记录
                    </div>
                `;
                updateStats();
                return;
            }
            
            history.forEach((entry, index) => {
                const item = document.createElement('div');
                item.className = `p-2 ${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'} rounded-md border-l-4 ${entry.isCorrect ? 'border-secondary' : 'border-danger'}`;
                
                // 设置运算类型的图标和颜色
                let operationIcon, operationColor;
                switch(entry.type) {
                    case 'add':
                        operationIcon = 'fa-plus';
                        operationColor = 'text-blue-500';
                        break;
                    case 'subtract':
                        operationIcon = 'fa-minus';
                        operationColor = 'text-green-500';
                        break;
                    case 'multiply':
                        operationIcon = 'fa-times';
                        operationColor = 'text-orange-500';
                        break;
                    case 'divide':
                        operationIcon = 'fa-divide';
                        operationColor = 'text-red-500';
                        break;
                }
                
                item.innerHTML = `
                    <div class="flex justify-between">
                        <span class="font-medium">${entry.problem}</span>
                        <span class="text-xs ${entry.isCorrect ? 'text-secondary' : 'text-danger'}">
                            ${entry.isCorrect ? '正确' : '错误'}
                        </span>
                    </div>
                    <div class="flex justify-between text-sm text-gray-600 mt-1">
                        <span><i class="fa-solid ${operationIcon} ${operationColor} mr-1"></i> ${entry.type === 'add' ? '加法' : 
                                                                                          entry.type === 'subtract' ? '减法' : 
                                                                                          entry.type === 'multiply' ? '乘法' : '除法'}</span>
                        <span>你的答案: ${entry.userAnswer}</span>
                    </div>
                `;
                
                historyList.appendChild(item);
            });
            
            updateStats();
        }
        
        // 更新统计信息
        function updateStats() {
            const correctCount = history.filter(entry => entry.isCorrect).length;
            const totalCount = history.length;
            const accuracy = totalCount > 0 ? ((correctCount / totalCount) * 100).toFixed(0) : 0;
            
            document.getElementById('stats').textContent = `正确率: ${accuracy}% (${correctCount}/${totalCount})`;
        }
        
        // 清空历史记录
        function clearHistory() {
            history = [];
            updateHistoryDisplay();
            
            // 添加动画效果
            const historyContainer = document.getElementById('history-container');
            historyContainer.classList.add('animate-pulse');
            setTimeout(() => {
                historyContainer.classList.remove('animate-pulse');
            }, 500);
        }
        
        // 导出历史记录
        function exportHistory() {
            if (history.length === 0) {
                alert('没有历史记录可导出');
                return;
            }
            
            // 转换历史记录为CSV格式
            let csvContent = "类型,题目,你的答案,正确答案,结果\n";
            
            history.forEach(entry => {
                const typeText = entry.type === 'add' ? '加法' : 
                                entry.type === 'subtract' ? '减法' : 
                                entry.type === 'multiply' ? '乘法' : '除法';
                const resultText = entry.isCorrect ? '正确' : '错误';
                
                csvContent += `${typeText},"${entry.problem}",${entry.userAnswer},${entry.correctAnswer},${resultText}\n`;
            });
            
            // 创建下载链接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `数学练习历史_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';
            
            // 触发下载
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 添加导出成功的视觉反馈
            const exportBtn = document.getElementById('export-history');
            exportBtn.classList.add('bg-secondary');
            exportBtn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> 已导出';
            
            setTimeout(() => {
                exportBtn.classList.remove('bg-secondary');
                exportBtn.innerHTML = '<i class="fa-solid fa-download mr-1"></i> 导出';
            }, 2000);
        }
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            // 默认生成题目
            generateProblems();
            
            // 为所有输入框添加回车提交功能
            document.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const activeElement = document.activeElement;
                    if (activeElement.id.endsWith('-answer')) {
                        const type = activeElement.id.replace('-answer', '');
                        checkAnswer(type);
                    }
                }
            });
        });
    </script>
</body>
</html>
